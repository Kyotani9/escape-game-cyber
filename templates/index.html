<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Escape — Mairie de L'Isle-Adam</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #090d16; color: #f1f5f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { max-width: 600px; width: 100%; background: #0f172a; border: 1px solid #1e293b; border-top: 5px solid #dc2626; border-radius: 12px; padding: 35px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
        .badge { background: #dc2626; color: white; font-size: 11px; font-weight: bold; padding: 4px 10px; border-radius: 4px; letter-spacing: 1px; display: inline-block; margin-bottom: 15px; }
        h1 { margin: 0 0 15px 0; font-size: 24px; color: #f8fafc; }
        .desc { background: #1e293b; padding: 16px; border-radius: 8px; font-size: 14px; line-height: 1.6; color: #94a3b8; border-left: 4px solid #f59e0b; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 6px; font-weight: 600; }
        input[type="text"], select { width: 100%; padding: 12px; background: #020617; border: 1px solid #334155; border-radius: 6px; color: #38bdf8; font-size: 15px; }
        select { color: #f8fafc; cursor: pointer; }
        .btn-start { width: 100%; padding: 14px; background: #dc2626; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-start:hover { background: #b91c1c; }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">MISSION CRITIQUE DSI</span>
        <h1>Opération Réseau Verrouillé</h1>
        <div class="desc">
            Le réseau municipal subit une attaque ciblée. Pour réactiver le pare-feu central, vous devez résoudre 4 incidents techniques réalistes et reconstituer le <strong>code maître à 4 chiffres</strong>.
        </div>
        <form method="POST">
            <div class="form-group">
                <label>Nom et Prénom de l'agent :</label>
                <input type="text" name="joueur" required placeholder="Ex: Jean Dupont">
            </div>
            <div class="form-group">
                <label>Direction / Service :</label>
                <select name="service" required>
                    {% for serv in services %}
                        <option value="{{ serv }}">{{ serv }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn-start">Lancer la mission d'investigation (25 min) →</button>
        </form>
    </div>
</body>
</html>
